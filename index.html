<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dom Bosco · Piloto</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="aviso" role="note">
    <strong>PILOTO · dados fictícios.</strong>
    <span class="aviso__longo">Nada é salvo: ao recarregar a página, tudo volta ao início.</span>
    <span class="aviso__curto">Nada é salvo.</span>
  </div>

  <div class="app">
    <aside class="lateral">
      <a class="marca" href="#/compras" aria-label="Dom Bosco, início">
        <img src="assets/logo.png" alt="Dom Bosco Padaria &amp; Pizzaria">
      </a>

      <nav class="menu" aria-label="Principal">
        <a class="menu__item" href="#/compras" data-rota="compras">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg>
          <span>Compras</span>
        </a>
        <a class="menu__item" href="#/estoque" data-rota="estoque">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
          <span>Estoque</span>
        </a>
      </nav>

      <p class="lateral__rodape">Piloto de validação.<br>Não é o sistema final.<br><span class="lateral__versao">Versão: etapa 7</span></p>
    </aside>

    <main id="conteudo" class="conteudo" tabindex="-1"></main>
  </div>

  <script type="module" src="js/app.js"></script>

  <noscript>O piloto precisa de JavaScript ativado no navegador.</noscript>
  <script>
    // Se o piloto não abrir (por exemplo, o navegador guardou arquivos antigos), explica o que fazer
    // em vez de deixar a tela em branco.
    window.addEventListener('error', function (e) { window.__erroDeCarga = e.message || 'erro ao carregar um arquivo'; }, true);
    setTimeout(function () {
      if (document.querySelector('#conteudo h1')) return;
      var detalhe = window.__erroDeCarga
        ? '<p style="margin:12px 0 0;font-size:13px;color:#6E5F5F">Detalhe técnico: ' + String(window.__erroDeCarga).replace(/[<>&]/g, '') + '</p>'
        : '';
      document.getElementById('conteudo').innerHTML =
        '<div role="alert" style="max-width:560px;margin:48px auto;padding:24px;background:#fff;border:1px solid #EBE4DD;border-left:5px solid #B80808;border-radius:12px;font:16px/1.5 \'Segoe UI\',system-ui,sans-serif;color:#2A1B1B">' +
        '<strong style="font-size:20px">O piloto não conseguiu abrir.</strong>' +
        '<p style="margin:12px 0 0">Isso costuma acontecer quando o navegador guardou arquivos antigos do piloto. Tente, nesta ordem:</p>' +
        '<ol style="margin:8px 0 0;padding-left:22px">' +
        '<li>Aperte <strong>Ctrl + F5</strong> (recarrega sem usar o que o navegador guardou).</li>' +
        '<li>Feche a <strong>janela preta</strong> do <code>iniciar.bat</code> e abra o <code>iniciar.bat</code> de novo.</li>' +
        '<li>Se ainda não abrir, me avise e copie o detalhe técnico abaixo.</li>' +
        '</ol>' + detalhe + '</div>';
    }, 4000);
  </script>
</body>
</html>
